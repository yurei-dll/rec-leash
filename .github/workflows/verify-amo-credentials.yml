name: Verify AMO credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Authenticate to Mozilla Add-ons
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify credentials with a read-only request
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/verify-amo-credentials.mjs
